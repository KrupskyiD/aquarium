server {
    listen 80;
    server_name saltguard.duckdns.org;

    return 301 https://$host$request_uri;
}
server {
    listen 443 ssl;
    server_name saltguard.duckdns.org;
    
    ssl_certificate /etc/letsencrypt/live/saltguard.duckdns.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/saltguard.duckdns.org/privkey.pem;

    location / {
        root   /usr/share/nginx/html;
        index  index.html index.htm;
        try_files $uri $uri/ /index.html;
    }

    location /api/ {
        proxy_pass http://16.170.204.185:3001/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}